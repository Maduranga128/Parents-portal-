<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidyartha Parents Portal</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1a73e8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Vidyartha%20Parents%20Portal%22,%22short_name%22:%22Vidyartha%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#ffffff%22,%22theme_color%22:%22#1a73e8%22,%22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/167/167707.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]} ">

    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f4f8; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 6px solid #1a73e8; }
        h2, h3 { text-align: center; color: #1a73e8; margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .hidden { display: none; }
        .result-card { background: #fff; padding: 15px; margin-top: 15px; border: 1px solid #eee; border-left: 6px solid #34a853; border-radius: 8px; position: relative; font-size: 14px; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 6px; border-radius: 4px; float: right; font-size: 11px; }
        .logout-btn { background: #6c757d; margin-top: 20px; }
        /* Mobile Optimization */
        @media (max-width: 600px) {
            .container { border-radius: 0; box-shadow: none; margin-top: 0; }
        }
    </style>
</head>
<body>

<div id="loginPage" class="container">
    <h2>Vidyartha Login</h2>
    <input type="text" id="username" placeholder="පරිශීලක නාමය">
    <input type="password" id="password" placeholder="මුරපදය">
    <button onclick="checkLogin()">Login</button>
</div>

<div id="mainApp" class="container hidden">
    <h2>Parents Portal</h2>
    
    <div id="addForm">
        <input type="text" id="studentName" placeholder="ළමයාගේ නම">
        <input type="text" id="studentClass" placeholder="පන්තිය">
        <input type="text" id="parentName" placeholder="දෙමාපියන්ගේ නම">
        <input type="text" id="job" placeholder="රැකියාව">
        <textarea id="support" placeholder="ලබාදිය හැකි සහයයන්"></textarea>
        <input type="tel" id="phone" placeholder="දුරකථන අංකය">
        <input type="text" id="address" placeholder="ලිපිනය">
        <button id="saveBtn" onclick="saveParentData()">Save to Cloud</button>
    </div>

    <div class="search-section" style="margin-top:20px; border-top: 1px solid #eee; padding-top:10px;">
        <h3>Search</h3>
        <select id="searchType">
            <option value="studentName">නම අනුව</option>
            <option value="job">රැකියාව අනුව</option>
            <option value="studentClass">පන්තිය අනුව</option>
        </select>
        <input type="text" id="searchInput" placeholder="Search here..." onkeyup="searchParent()">
        <div id="searchResults"></div>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDn-IYmpALOqog-o-E4N3JA_ZaXWvnGAbs",
    authDomain: "vidyartha-parents-portal.firebaseapp.com",
    projectId: "vidyartha-parents-portal",
    storageBucket: "vidyartha-parents-portal.firebasestorage.app",
    messagingSenderId: "33674213629",
    appId: "1:33674213629:web:30eb2ff3ec74d66100e694"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.checkLogin = () => {
    if (document.getElementById("username").value === "vidyartha" && document.getElementById("password").value === "19460101") {
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("mainApp").classList.remove("hidden");
    } else { alert("Login Failed!"); }
  };

  window.logout = () => { location.reload(); };

  window.saveParentData = async () => {
    const sName = document.getElementById("studentName").value.trim();
    const sClass = document.getElementById("studentClass").value.trim();
    const pName = document.getElementById("parentName").value.trim();
    const phone = document.getElementById("phone").value.trim();

    if (!sName || !phone) { alert("නම සහ දුරකථන අංකය ඕනෙමයි!"); return; }

    const saveBtn = document.getElementById("saveBtn");
    saveBtn.disabled = true;
    saveBtn.innerText = "Checking...";

    try {
        const q = query(collection(db, "parents"), where("studentName", "==", sName), where("studentClass", "==", sClass));
        const check = await getDocs(q);
        if (!check.empty) { alert("දැනටමත් ඇතුළත් කර ඇත!"); return; }

        await addDoc(collection(db, "parents"), {
            studentName: sName, studentClass: sClass, parentName: pName,
            job: document.getElementById("job").value.trim(),
            support: document.getElementById("support").value.trim(),
            phone: phone, address: document.getElementById("address").value.trim(),
            timestamp: new Date()
        });
        alert("සාර්ථකව සුරැකුණා!");
        document.querySelectorAll("input, textarea").forEach(el => el.value = "");
    } catch(e) { alert(e.message); } finally { saveBtn.disabled = false; saveBtn.innerText = "Save to Cloud"; }
  };

  window.searchParent = async () => {
    const text = document.getElementById("searchInput").value;
    const type = document.getElementById("searchType").value;
    const resDiv = document.getElementById("searchResults");
    resDiv.innerHTML = "";
    if (text.length < 1) return;

    const q = query(collection(db, "parents"), where(type, ">=", text), where(type, "<=", text + '\uf8ff'));
    const snap = await getDocs(q);
    snap.forEach((docRef) => {
        const d = docRef.data();
        resDiv.innerHTML += `<div class="result-card" id="card-${docRef.id}">
            <button class="delete-btn" onclick="deleteEntry('${docRef.id}')">Delete</button>
            <p><b>${d.studentName}</b> (${d.studentClass})</p>
            <p>${d.parentName} - ${d.job}</p>
            <p>Tel: ${d.phone}</p>
        </div>`;
    });
  };

  window.deleteEntry = async (id) => {
    if (confirm("Delete this?")) {
        await deleteDoc(doc(db, "parents", id));
        document.getElementById("card-"+id).remove();
    }
  };

  // Service Worker for Offline (Basic)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('data:text/javascript,self.addEventListener("fetch", function(event) {});');
  }
</script>
</body>
</html>
